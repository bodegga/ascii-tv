# tv.bodegga.net -> ascii-tv on 127.0.0.1:8090
#
# Streams are long (Die Hard is 2h12m) and must not be buffered, or viewers
# see nothing and then the whole movie at once.
#
# Privacy: access logs keep a truncated client network (/24 or /48), the path
# WITHOUT the query string (so ?key=... is never logged), status, bytes and
# user agent. /var/log/nginx/*.log rotates daily and keeps 14 days.

map $remote_addr $tv_anon_ip {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+$   $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+):     $ip::;
    default                         0.0.0.0;
}

log_format tv_privacy '$tv_anon_ip [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name tv.bodegga.net;

    access_log /var/log/nginx/tv.access.log tv_privacy;
    error_log  /var/log/nginx/tv.error.log crit;  # error lines can include client IPs

    # certbot adds the 443 listener + certificate lines here. Plain HTTP stays
    # on purpose: `curl tv.bodegga.net` must work with no -L. The app itself
    # redirects browsers (Accept: text/html) to HTTPS.

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
        send_timeout 60s;
    }
}
